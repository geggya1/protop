name: Produksjonsstatus

# Kjøres manuelt. Leser (endrer ingenting) hva som faktisk finnes i protop-c189c:
# funksjoner, API-er, Storage-bucket, indekser og hemmeligheter. Resultatet står
# i oppsummeringen av kjøringen. «Ingen tilgang» betyr at deploy-kontoen ikke får
# lese det, ikke nødvendigvis at det mangler.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Les status
        run: bash scripts/production-status.sh >> "$GITHUB_STEP_SUMMARY"
