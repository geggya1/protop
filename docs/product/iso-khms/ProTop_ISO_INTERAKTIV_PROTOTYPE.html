function clickBtn(t,fun,cls=''){return `<button class="btn ${cls}" onclick="${fun}">${t}</button>`}
function openDrawer(title,body,button='Lagre utkast',fn=null){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;const b=document.getElementById('drawerAction');b.textContent=button;b.onclick=fn||(()=>{toast('Endring demonstrert. Ingen data sendt til server.');closeDrawer()});document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open')}
function toast(t){let old=document.getElementById('toast');if(old)old.remove();let d=document.createElement('div');d.id='toast';d.style='position:fixed;z-index:150;bottom:85px;right:19px;max-width:350px;background:#225078;border:1px solid #51a5ee;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 35px #0007;font-size:13px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function detail(title,description){openDrawer(title,`<p class="sub">${e(description)}</p><div class="hintbox">I produksjon vises objekt-ID, eier, historikk, rettigheter, relaterte dokumenter, ISO-krav og faktiske handlinger.</div><br><h3>Revisjonsspor</h3><p class="sub">Alle endringer lagres med aktør, tid, feltendringer og dokumentversjon.</p>`,'Lukk',closeDrawer)}
function statusTable(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function trend(){const a=D.trends, mx=12,w=620,h=205,p=35;let bars=a.map((x,i)=>{let cx=p+i*95+25;return `<rect x="${cx-11}" y="${h-(x.new/mx)*165}" width="21" height="${x.new/mx*165}" rx="3" fill="#4eacff" tabindex="0" role="button" onclick="openFiltered('Nye avvik ${x.month}')"/><rect x="${cx+13}" y="${h-x.closed/mx*165}" width="21" height="${x.closed/mx*165}" rx="3" fill="#4bd09c" tabindex="0" role="button" onclick="openFiltered('Lukkede avvik ${x.month}')"/><text x="${cx+7}" y="226" font-size="11" fill="#9aacc0" text-anchor="middle">${x.month}</text>`}).join('');let grid=[0,3,6,9,12].map(n=>`<line x1="35" y1="${h-n/mx*165}" x2="610" y2="${h-n/mx*165}" stroke="#33455b" stroke-width="1"/><text x="12" y="${h-n/mx*165+4}" font-size="11" fill="#92a9bf">${n}</text>`).join('');return `<div class="chart"><svg viewBox="0 0 630 240" role="img" aria-label="Stolpediagram nye og lukkede avvik januar til juni">${grid}${bars}</svg></div><div class="legend"><span><i class="dot" style="background:#4eacff"></i>Nye avvik</span><span><i class="dot" style="background:#4bd09c"></i>Lukkede</span></div>`}
function riskMatrix(){let arr=[[],[],[],[],[]];D.risks.forEach(r=>arr[r.impact-1].push(r));let s='<div class="risk"><div></div>';for(let j=1;j<=5;j++)s+=`<div class="axis">${j}</div>`;for(let y=5;y>=1;y--){s+=`<div class="axis">${y}</div>`;for(let x=1;x<=5;x++){let n=D.risks.filter(r=>r.likelihood===x&&r.impact===y).length;let score=x*y,k=score>=17?5:score>=12?4:score>=7?3:score>=4?2:1;s+=`<button class="risk-cell risk-${k}" onclick="openRiskCell(${x},${y})" title="Sannsynlighet ${x}, konsekvens ${y}">${n?n:''}</button>`}}return s+'</div><p class="caption">X: sannsynlighet 1–5 · Y: konsekvens 1–5. Kun eksempel på risikopolicy.</p>'}
function openRiskCell(x,y){let rs=D.risks.filter(r=>r.likelihood===x&&r.impact===y);openDrawer('Risikocelle '+x+' × '+y,rs.length?rs.map(r=>`<div class="card"><b>${e(r.title)}</b><p class="sub">${r.id} · ${r.kind}</p></div>`).join(''):'<p class="sub">Ingen registreringer i denne cellen.</p>','Lukk',closeDrawer)}
function ring(){let vals=[49,20,15,9,4,3],colors=['#4bd09c','#62b7ff','#eac778','#f09a78','#ff7684','#9b8fd8'];let sum=0,r=66,arr=vals.map((v,i)=>{let c=2*Math.PI*r, dash=v/100*c,offset=-sum/100*c;sum+=v;return `<circle cx="95" cy="95" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="25" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${offset}" transform="rotate(-90 95 95)" onclick="navigate('requirements')" style="cursor:pointer"/>`}).join('');return `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 190 190" width="190" height="190">${arr}<text x="95" y="96" text-anchor="middle" fill="white" font-weight="700" font-size="27">100</text><text x="95" y="113" text-anchor="middle" fill="#92a9bf" font-size="10">kravposter (demo)</text></svg><div style="font-size:11px;line-height:2.2">${['Internt verifisert','Bevis tilgjengelig','Under arbeid','Mangler','Avvik','Må revurderes'].map((x,i)=>`<div style="cursor:pointer" onclick="navigate('requirements')"><i class="dot" style="background:${colors[i]}"></i>${x} <b>${vals[i]}</b></div>`).join('')}</div></div><p class="caption">Fordeling av internt vurderte kravposter. Ikke en sertifiseringsgrad.</p>`}
function openFiltered(title){openDrawer(title,`<div class="hintbox">Demo av drill-down til filtrert avviksregister. I produksjon må antall, datoperiode og autorisert filter være identisk med grafen.</div><br>${tableDeviation()}`,'Åpne avvik',()=>{closeDrawer();navigate('deviations')})}
function tableDeviation(){return statusTable(['ID','Avvik','Område','Status'],[...D.deviations,...demoRecords].map(r=>`<tr class="clickable" onclick="detail('${e(r.id)}','${e(r.title)}')"><td>${e(r.id)}</td><td>${e(r.title)}</td><td>${e(r.type)}</td><td>${tag(r.status)}</td></tr>`))}
function dashboard(){return head('Samlet operativ styring for kvalitet, ytre miljø og arbeidsmiljø. Tallene er fiktive.',clickBtn('＋ Registrer avvik',"openDemoForm('Avvik / RUH')",'primary')+clickBtn('Åpne prosessbygger',"navigate('designer')"))+`<div class="banner">Fiktive eksempeldata · Ingen status her utgjør en ISO-sertifisering eller bekreftet lovetterlevelse.</div><div class="grid g4">${D.kpis.map(k=>`<article class="card kpi" onclick="${k.id==='findings'?'navigate(\'deviations\')':k.id==='audits'?'navigate(\'audits\')':k.id==='training'?'navigate(\'competence\')':'navigate(\'deviations\')'}"><div class="sub">${k.label}</div><div class="val">${k.value}</div><div class="hint">Vis grunnlag og oppfølging ↗</div></article>`).join('')}</div><div class="grid split" style="margin-top:15px">${box('Nye og lukkede avvik',trend())}${box('Intern vurderingsstatus – krav',ring())}</div><div class="grid split" style="margin-top:15px">${box('Risikobilde – eksempel 5 × 5',riskMatrix())}${box('Kommende aktiviteter',D.audits.map(x=>`<div class="tile" onclick="detail('${e(x.title)}','Revisjonsdato ${x.date}')"><b>${e(x.title)}</b><p class="sub" style="margin:6px 0 0">${e(x.date)} · ${e(x.status)}</p></div>`).join(''))}</div>`}
function scope(){return head('Definer hvilke virksomheter, lokasjoner, aktiviteter, tjenester og standarder som omfattes.',clickBtn('Rediger omfang',"openDemoForm('Sertifiseringsomfang')",'primary'))+`<div class="grid g2">${box('Omfang og enheter',`<h3>Eksempelselskap AS</h3><p class="sub">Rådgivning · Prosjektering · Prosjektledelse</p><div class="tile" onclick="detail('Sør AS','Underavdeling i sertifiseringsomfang')">↳ Eksempelselskap Sør AS</div><div class="tile" onclick="detail('Øst AS','Underavdeling i sertifiseringsomfang')">↳ Eksempelselskap Øst AS</div><p class="caption">Endring krever vurdering av berørte krav, prosesser, risiko og dokumenter.</p>`)}${box('Aktive standarder',`<div class="tile">ISO 9001:2026 ${tag('Aktiv')}</div><div class="tile">ISO 14001:2026 ${tag('Aktiv')}</div><div class="tile">ISO 45001:2018 + Amd 1:2024 ${tag('Aktiv')}</div><p class="caption">Klausulmapping skal faglig valideres mot lisensierte utgaver.</p>`)}</div>`}
function processLandscape(){let proc=[['Ledelse','Virksomhetsstyring','scope'],['Ledelse','Ledelsens gjennomgang','management'],['Kjerne','Anbud og kundekrav','suppliers'],['Kjerne','Kontrakt og prosjekt','processes'],['Kjerne','Prosjektering og kontroll','documents'],['Kjerne','Leveranse og evaluering','kpis'],['Støtte','Kompetanse','competence'],['Støtte','Dokumentstyring','documents'],['Støtte','Avvik og forbedringer','deviations']];return head('Klikkbare prosessbokser viser eierskap, underprosesser, tilknyttede skjemaer og ISO-krav.',clickBtn('Tegn ny prosess',"navigate('designer')",'primary'))+['Ledelse','Kjerne','Støtte'].map(t=>box(t+'sprosesser',`<div class="process-map">${proc.filter(x=>x[0]===t).map(x=>`<div class="procbox" onclick="navigate('${x[2]}')"><div class="ic">${t==='Ledelse'?'⚖':t==='Kjerne'?'▣':'♧'}</div><strong>${x[1]}</strong><span class="sub">Åpne prosess ↗</span></div>`).join('<span class="arrow">→</span>')}</div>`)).join('<div style="height:14px"></div>')}
function designer(){return head('Dra bokser, klikk for å redigere, legg til noder, opprett koblinger og valider før publisering.',clickBtn('Valider prosess','validateProcess()')+clickBtn('Simuler sak',"runSimulation()")+clickBtn('Publiser',"toast('Demo: publisering krever godkjennings- og versjonsmotor i backend')",'primary'))+`<div class="banner">Dette er en lokal UI-demo. Nodeendringer og koblinger lagres ikke på server. I produksjon gjelder versjonslås, RBAC, godkjenning og sporbar kjørbar workflow.</div><div class="designer"><section class="palette"><h3>Nodepalett</h3>${[['start','◉','Start'],['task','☷','Oppgave'],['form','▤','Skjema'],['decision','◇','Beslutning'],['approval','✓','Godkjenning'],['document','▥','Dokument'],['end','⬤','Slutt']].map(a=>`<div class="palitem" onclick="addNode('${a[0]}')">${a[1]} ${a[2]} ＋</div>`).join('')}<p class="mini">Velg en boks, trykk «Koble fra valgt», og velg neste boks.</p></section><div class="canvasouter"><div class="canvas" id="canvas"><svg class="connections" id="connections"></svg><div id="nodes"></div></div></div><section class="inspector"><h3>Egenskaper</h3><div id="nodeProperties"><p class="sub">Velg en prosessboks for å se og endre egenskaper.</p></div><div style="margin-top:16px" class="hintbox">Designmodus og bruksmodus er separate. En publisert prosess kan ikke endres uten ny versjon.</div></section></div><p class="caption">Demo: 1640 px arbeidsflate. Panorer horisontalt ved behov. På mobil anbefales fokusert trinnvisning.</p>`}
function drawNodes(){let holder=document.getElementById('nodes'),svg=document.getElementById('connections');if(!holder||!svg)return;holder.innerHTML=dataNodes.map(n=>`<div class="wedge ${n.type} ${selectedNode===n.id?'selected':''}" data-id="${n.id}" tabindex="0" role="button" style="left:${n.x}px;top:${n.y}px" onclick="nodeClick('${n.id}')" onpointerdown="nodeDrag(event,'${n.id}')"><span class="wicon">${({start:'◉',form:'▤',task:'☷',decision:'◇',approval:'✓',document:'▥',end:'⬤'})[n.type]||'⬡'}</span><strong>${e(n.label)}</strong></div>`).join('');redrawEdgesOnly();let n=dataNodes.find(x=>x.id===selectedNode);document.getElementById('nodeProperties').innerHTML=n?`<label class="field">Node-ID<input value="${e(n.id)}" disabled></label><label class="field">Navn<input id="nodeLabel" value="${e(n.label)}" onchange="updateNodeLabel(this.value)"></label><label class="field">Type<input value="${n.type}" disabled></label><label class="field">Ansvarlig rolle<select id="nodeRole"><option>Prosesseier</option><option>Prosjektleder</option><option>Kvalitetsleder</option><option>HMS-ansvarlig</option></select></label><div class="actions">${clickBtn('Koble fra valgt',"connectFrom='"+n.id+"';toast('Velg mål-node for å koble')")}${clickBtn('Åpne handling',"openDemoForm('Avvik / RUH')",'primary')}</div><p class="mini">Boksen kan dras på canvas. Egenskapene er lokale demodata.</p>`:'<p class="sub">Velg en boks for å se og endre egenskaper.</p>'}
function redrawEdgesOnly(){const svg=document.getElementById("connections");if(!svg)return;let elements=dataEdges.map(ed=>{const a=dataNodes.find(n=>n.id===ed.from),b=dataNodes.find(n=>n.id===ed.to);if(!a||!b)return'';let x1=a.x+150,y1=a.y+31,x2=b.x,y2=b.y+31,dx=Math.max(45,(x2-x1)*.5);return `<path d="M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}" stroke="#5e98bb" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-9}" fill="#ffcf87" font-size="12">${e(ed.label||'')}</text>`}).join('');svg.innerHTML=`<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5e98bb"/></marker></defs>${elements}`;}
function nodeClick(id){if(connectFrom&&connectFrom!==id){if(!dataEdges.some(e=>e.from===connectFrom&&e.to===id))dataEdges.push({from:connectFrom,to:id});toast('Kobling opprettet i demo');connectFrom=null;}selectedNode=id;drawNodes()}
function updateNodeLabel(v){const n=dataNodes.find(n=>n.id===selectedNode);if(n)n.label=v;drawNodes()}
function addNode(type){let n={id:'n'+(++nodeSeq),type,label:'Ny '+type,x:280+dataNodes.length*45,y:340};dataNodes.push(n);selectedNode=n.id;drawNodes();toast('Node lagt til – konfigurer i høyre panel')}
function nodeDrag(ev,id){if(ev.button!==0)return;let t=ev.currentTarget,x0=ev.clientX,y0=ev.clientY,node=dataNodes.find(n=>n.id===id),nx=node.x,ny=node.y,moved=false;t.setPointerCapture(ev.pointerId);function move(e){let dx=e.clientX-x0,dy=e.clientY-y0;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;node.x=Math.max(0,nx+dx);node.y=Math.max(0,ny+dy);t.style.left=node.x+'px';t.style.top=node.y+'px';redrawEdgesOnly()}function up(){t.removeEventListener('pointermove',move);t.removeEventListener('pointerup',up);if(moved){selectedNode=id;drawNodes()}}t.addEventListener('pointermove',move);t.addEventListener('pointerup',up)}
function validateProcess(){let starts=dataNodes.filter(n=>n.type==='start'),ends=dataNodes.filter(n=>n.type==='end'),dec=dataNodes.filter(n=>n.type==='decision');let issues=[];if(starts.length!==1)issues.push('Prosessen må ha nøyaktig ett startpunkt.');if(!ends.length)issues.push('Prosessen må ha minst ett sluttpunkt.');for(let n of dec){let out=dataEdges.filter(e=>e.from===n.id);if(out.length<2)issues.push('Beslutningen «'+n.label+'» mangler alternativ gren.')}if(issues.length)openDrawer('Validering – funn',issues.map(x=>'<p class="tag red">'+e(x)+'</p>').join(''),'Lukk',closeDrawer);else openDrawer('Validering – grunnkontroll',`<p>Grunnleggende grafkontroll fullført uten funn.</p><div class="banner">Produksjonsvalidering må også sjekke tilgjengelighet/reachability, sikkerhet, rollereferanser, grenbetingelser, versjoner, skjemareferanser og avslutning.</div>`,'Lukk',closeDrawer)}
function runSimulation(){let seq=['Registrer avvik','Vurder og klassifiser','Krever tiltak?','Årsak og tiltak','Effektkontroll','Lukk avvik'];openDrawer('Simuler arbeidsflyt',`<p class="sub">Eksempel på kjøring av publisert prosess – demo, ikke en reell prosessinstans.</p><div class="steps">${seq.map((s,i)=>`<button class="step ${i===0?'active':''}" onclick="document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));this.classList.add('active');document.getElementById('siminfo').innerText='Aktivt trinn: '+this.innerText">${i+1}. ${s}</button>`).join('')}</div><p id="siminfo" style="margin-top:15px">Aktivt trinn: Registrer avvik</p>`,'Registrer avvik',()=>{closeDrawer();openDemoForm('Avvik / RUH')})}
function requirements(){let arr=D.requirements.filter(x=>currentFilter==='alle'||x.standard===currentFilter);return head('Kravpost → ansvar → dokumentasjon → intern vurdering → funn og revisjonsspor.',clickBtn('Vurder krav',"detail('Kravvurdering','Må gjennomføres av autorisert ansvarlig, aldri automatisk ved vedlegg')",'primary'))+`<div class="toolbar"><span class="sub">Standard:</span><select onchange="currentFilter=this.value;render()"><option value="alle" ${currentFilter==='alle'?'selected':''}>Alle</option>${['9001','14001','45001'].map(s=>`<option ${currentFilter===s?'selected':''} value="${s}">ISO ${s}</option>`).join('')}</select><span class="tag orange">Klausulmapping må fagverifiseres</span></div>`+box('Kravmatrise – illustrasjon',statusTable(['Krav-ID','Standard','Kapittel','Område','Intern vurdering','Bevis'],arr.map(x=>`<tr class="clickable" onclick="detail('${x.id}','${e(x.name)} · dokumentasjon ${e(x.evidence)}')"><td>${x.id}</td><td>ISO ${x.standard}</td><td>${x.chapter}</td><td>${e(x.name)}</td><td>${tag(x.status)}</td><td>${e(x.evidence)}</td></tr>`)))+`<p class="caption">Statusene er interne vurderinger, ikke ISO-sertifisering. Produksjonsløsningen må ha fullstendig, kontrollert kravregister.</p>`}
function deviations(){return head('Registrer hendelser, analyser årsaker, planlegg tiltak, kontroller effekt og lukk.',clickBtn('＋ Nytt avvik',"openDemoForm('Avvik / RUH')",'primary')+clickBtn('Vis prosessen',"navigate('designer')"))+`<div class="grid g4">${[['Til registrering','3'],['Under behandling','8'],['Effektkontroll','2'],['Forfalte tiltak','4']].map(x=>`<div class="card kpi" onclick="openFiltered('${x[0]}')"><div class="sub">${x[0]}</div><div class="val">${x[1]}</div></div>`).join('')}</div><div style="margin-top:14px">${box('Avviksregister',tableDeviation())}</div><div style="margin-top:14px">${box('Arbeidsflyt – klikk på trinn',`<div class="steps">${['Registrer','Vurder','Årsaksanalyse','Tiltak','Effektkontroll','Lukk'].map(x=>`<button class="step" onclick="detail('${x}','Detaljert tilstand, tildelt rolle, frister og relaterte bevis')">${x}</button>`).join('')}</div>`)}</div>`}
function risks(){return head('Kartlegg risiko og muligheter på virksomhets- og prosjektnivå, før og etter tiltak.',clickBtn('Ny risikovurdering',"openDemoForm('Risikovurdering')",'primary'))+`<div class="grid split">${box('5 × 5 risikomatrise',riskMatrix())}${box('Aktive risikoer',statusTable(['Risiko','Kategori','P × K'],D.risks.map(r=>`<tr class="clickable" onclick="detail('${e(r.title)}','${r.id} · iboende risiko ${r.likelihood} × ${r.impact}')"><td>${e(r.title)}</td><td>${r.kind}</td><td>${r.likelihood}×${r.impact}</td></tr>`)))}</div>`}
function environment(){return head('Vurder miljøaspekter og vesentlighet, mål, transport, energi og avfall.',clickBtn('Registrer miljøaspekt',"openDemoForm('Miljøaspekt')",'primary'))+`<div class="grid g3">${[['Transport og utslipp','Vesentlig'],['Energibruk','Under vurdering'],['Avfall og ombruk','Vesentlig']].map(x=>`<div class="card kpi" onclick="detail('${x[0]}','Miljøaspekt med metode, kriterier, kontroll og tiltak')"><span class="iconcircle">♧</span><h3 style="margin-top:12px">${x[0]}</h3>${tag(x[1])}</div>`).join('')}</div><div style="margin-top:14px">${box('Transport – fiktivt eksempel',`<div class="chart"><svg viewBox="0 0 620 225"><line x1="40" y1="195" x2="590" y2="195" stroke="#456"/>${[2200,1970,1810,1620].map((v,i)=>`<rect x="${85+i*127}" y="${195-v/2500*155}" width="58" height="${v/2500*155}" fill="#4bd09c" rx="5"/><text x="${114+i*127}" y="${182-v/2500*155}" fill="#e7f1fa" text-anchor="middle" font-size="12">${v}</text><text x="${114+i*127}" y="215" fill="#a8b8c9" text-anchor="middle" font-size="12">Q${i+1}</text>`).join('')}</svg></div><p class="caption">Kjørte km per kvartal. Ingen automatisk CO₂-beregning uten dokumentert metode og faktorversjon.</p>`)}</div>`}
function hms(){return head('Fareidentifikasjon, arbeidstakermedvirkning, vernerunder og beredskap.',clickBtn('Ny HMS-hendelse',"openDemoForm('Avvik / RUH')",'primary')+clickBtn('SJA / farevurdering',"openDemoForm('Risikovurdering')"))+`<div class="grid g3">${[['Farekartlegging','12 registreringer'],['Medvirkning','2 møter dokumentert'],['Vernerunder','3 planlagt']].map(x=>`<div class="card kpi" onclick="detail('${x[0]}','Dokumentasjon og tiltak')"><h3>${x[0]}</h3><div class="sub">${x[1]}</div></div>`).join('')}</div><div style="margin-top:14px">${box('Roller og lovkrav',`<div class="callout">Skille mellom virksomhetens HMS-system og SHA etter byggherreforskriften. SJA/vernerunder utløses av lov, risiko og kontrakt – ikke som universelt ISO-krav.</div><div class="steps">${['Arbeidstakermedvirkning','Farekartlegging','Hendelser','Beredskap','Lovetterlevelse'].map(x=>`<button class="step" onclick="detail('${x}','Relevant risiko, ansvar og dokumentasjon')">${x}</button>`).join('')}</div>`)}</div>`}
function documents(){return head('Versjonsstyrte prosedyrer, dokumenter, godkjenninger og arkiv.',clickBtn('Nytt dokument',"openDemoForm('Dokumentendring')",'primary'))+box('Dokumentregister',statusTable(['ID','Dokument','Revisjon','Status','Eier'],D.documents.map(x=>`<tr class="clickable" onclick="detail('${x.id}','${e(x.title)} – revisjon ${x.revision}')"><td>${x.id}</td><td>${e(x.title)}</td><td>${x.revision}</td><td>${tag(x.status)}</td><td>${x.owner}</td></tr>`)))+`<p class="caption">Historiske bevis skal alltid peke på spesifikk godkjent dokumentrevisjon.</p>`}
function audits(){return head('Risikobasert revisjonsprogram med planlegging, funn og tiltaksoppfølging.',clickBtn('Planlegg revisjon',"openDemoForm('Internrevisjon')",'primary'))+box('Revisjonsplan',statusTable(['ID','Revisjon','Dato','Status'],D.audits.map(x=>`<tr class="clickable" onclick="detail('${x.id}','${e(x.title)} – ${x.date}')"><td>${x.id}</td><td>${e(x.title)}</td><td>${x.date}</td><td>${tag(x.status)}</td></tr>`)))+`<div style="height:14px"></div>`+box('Revisjonsflyt',`<div class="steps">${['Program','Plan','Utfør','Funn','Rapport','Tiltak','Verifiser'].map(x=>`<button class="step" onclick="detail('${x}','Revisjonsaktivitet, bevis og resultat')">${x}</button>`).join('')}</div>`)}

function formField(k,label,type='text',opts=[]){let id='f_'+k;if(type==='select')return `<label class="field">${label}<select id="${id}">${opts.map(x=>`<option>${e(x)}</option>`).join('')}</select></label>`;if(type==='textarea')return `<label class="field full">${label}<textarea id="${id}" placeholder="Skriv her..."></textarea></label>`;return `<label class="field">${label}<input type="${type}" id="${id}" placeholder="${e(label)}"></label>`}
function openDemoForm(name){activeForm=name;let common=formField('title','Tittel *')+formField('date','Dato','date');let extra='';switch(name){case 'Avvik / RUH':extra=formField('category','Kategori','select',['Kvalitet','Miljø','Arbeidsmiljø','Forbedringsforslag'])+formField('project','Prosjekt','select',['Ikke prosjektspesifikk','Prosjekt Alpha','Prosjekt Beta'])+formField('description','Beskrivelse / hva skjedde? *','textarea')+formField('severity','Alvorlighet','select',['Lav','Middels','Høy','Kritisk'])+formField('owner','Ansvarlig','select',['Kvalitetsleder','HMS-ansvarlig','Prosjektleder'])+formField('action','Strakstiltak','textarea');break;case 'Risikovurdering':extra=formField('type','Risikokategori','select',['Kvalitet','Miljø','Arbeidsmiljø','Prosjekt'])+formField('likelihood','Sannsynlighet 1–5','number')+formField('impact','Konsekvens 1–5','number')+formField('barrier','Eksisterende tiltak og barrierer','textarea')+formField('future','Planlagte tiltak','textarea');break;case 'Miljøaspekt':extra=formField('aspect','Miljøaspekt','select',['Energi','Transport','Utslipp','Avfall','Ressursforbruk','Naturmangfold'])+formField('lifecycle','Livsløpsfase','select',['Innkjøp','Drift','Prosjekt','Leverandør','Avhending'])+formField('criteria','Vesentlighetskriterier / begrunnelse','textarea')+formField('control','Tiltak / måling','textarea');break;case 'Internrevisjon':extra=formField('auditScope','Revisjonsomfang')+formField('auditor','Uavhengig revisor')+formField('method','Revisjonsmetode','select',['Intervju og dokumentkontroll','Stikkprøve','Observasjon'])+formField('findings','Funn og objektive bevis','textarea');break;case 'Kompetanse':extra=formField('person','Ansatt')+formField('role','Kompetansekrav')+formField('validity','Gyldig til','date')+formField('evidence','Bevis og vurdering','textarea');break;case 'Ledelsens gjennomgang':extra=formField('chair','Møteleder')+formField('inputs','Inndata – resultater, revisjoner, endringer','textarea')+formField('decisions','Beslutninger og tiltak','textarea');break;default:extra=formField('scope','Virksomhet / prosjekt')+formField('description','Vurdering og beskrivelse','textarea')+formField('responsible','Ansvarlig')+formField('deadline','Frist','date')}
openDrawer('Skjema · '+name,`<div class="hintbox">DEMO: Felt og validering viser UX-prinsippet. Produksjonen krever komplett feltmodell, rettigheter, versjonering, vedlegg, godkjenning og revisjonsspor.</div><div class="form-grid" style="margin-top:16px">${common+extra}</div><p class="caption">* Obligatoriske felt. Formversjon: demo-v1.</p>`,'Registrer demo-utkast',()=>saveForm(name))}
function saveForm(name){let title=document.getElementById('f_title')?.value?.trim(),date=document.getElementById('f_date')?.value;if(!title){toast('Tittel må fylles ut');document.getElementById('f_title')?.focus();return}let desc=document.getElementById('f_description');if(name==='Avvik / RUH'&&(!desc||!desc.value.trim())){toast('Beskrivelse må fylles ut');desc?.focus();return}formDrafts.push({name,title,date});if(name==='Avvik / RUH'){let r={id:'AV-DEMO-'+String(demoRecords.length+1).padStart(3,'0'),title,type:document.getElementById('f_category')?.value||'Kvalitet',status:'Til vurdering'};demoRecords.push(r)}closeDrawer();toast('Demo-utkast registrert lokalt – ikke lagret på server');if(name==='Avvik / RUH')navigate('deviations')}

function miniViz(k){
 let pre='<svg viewBox="0 0 185 95" class="gal-preview" role="img" aria-label="Illustrativ graf">',post='</svg>';
 const line='<polyline points="8,76 36,60 66,65 96,33 126,46 151,18 176,30" fill="none" stroke="#4eacff" stroke-width="3"/>';
 const rect=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"/>`;
 const t=(x,y,l)=>`<text x="${x}" y="${y}" fill="#afc4d5" font-size="9">${l}</text>`;
 let o='';
 if(k==='kpi')o=t(10,21,'Åpne funn')+`<text x="10" y="63" font-size="36" font-weight="800" fill="#fff">14</text>`+t(91,61,'↘ -2 siste uke');
 else if(k==='line')o=line+'<polyline points="8,66 36,72 66,54 96,60 126,25 151,39 176,19" fill="none" stroke="#46d1a1" stroke-width="2.5"/>';
 else if(k==='bar')o=[49,31,66,37].map((h,i)=>rect(15,12+i*22,h*2.2,14,'#58aefe')).join('');
 else if(k==='stack')o=[25,45,55,34].map((h,i)=>rect(18+i*41,75-h,25,h,'#4399d5')+rect(18+i*41,75-h-15,25,15,'#45c38e')).join('');
 else if(k==='group')o=[0,1,2,3].map(i=>rect(12+i*43,75-[35,44,59,49][i],13,[35,44,59,49][i],'#439fe9')+rect(28+i*43,75-[24,56,43,57][i],13,[24,56,43,57][i],'#4bd09c')).join('');
 else if(k==='pareto')o=[58,48,38,22].map((h,i)=>rect(13+i*43,76-h,28,h,'#4eacff')).join('')+'<polyline points="27,60 70,40 112,25 156,14" fill="none" stroke="#f5c26a" stroke-width="3"/>';
 else if(k==='donut')o='<circle cx="92" cy="48" r="32" fill="none" stroke="#27405a" stroke-width="17"/><circle cx="92" cy="48" r="32" fill="none" stroke="#46c895" stroke-width="17" stroke-dasharray="119 82" transform="rotate(-90 92 48)"/><circle cx="92" cy="48" r="32" fill="none" stroke="#4eacff" stroke-width="17" stroke-dasharray="60 141" stroke-dashoffset="-119" transform="rotate(-90 92 48)"/>';
 else if(['matrix','heatmap'].includes(k))o=Array.from({length:25},(_,i)=>rect(17+(i%5)*31,8+Math.floor(i/5)*17,27,14,["#63cb9e","#9cce8d","#edc476","#f1987e","#ef7185"][(i%5+Math.floor(i/5))%5])).join('');
 else if(k==='gauge')o=rect(14,28,156,23,'#263950')+rect(14,28,119,23,'#4eacff')+t(15,20,'76 % / mål 90 %');
 else if(k==='calendar')o=Array.from({length:28},(_,i)=>rect(13+(i%7)*23,7+Math.floor(i/7)*21,20,17,i%11===0?'#4bd09c':i%8===0?'#ef9e68':'#27394a')).join('');
 else if(k==='gantt')o=[['Prosess',10,67],['Tiltak',40,98],['Revisjon',70,140]].map((r,i)=>rect(r[1],17+i*23,r[2]-r[1],14,['#4eacff','#4bd09c','#f0c67d'][i])).join('');
 else if(k==='funnel')o=[0,1,2,3].map(i=>`<polygon points="${14+i*17},${12+i*20} ${171-i*17},${12+i*20} ${160-i*19},${28+i*20} ${25+i*19},${28+i*20}" fill="${['#329fe8','#57b6e9','#5ac7a5','#e0ba72'][i]}"/>`).join('');
 else if(k==='sankey')o='<path d="M20,10 C70,10 95,30 162,30 M20,50 C70,50 95,30 162,30 M20,75 C70,75 95,65 162,65" fill="none" stroke="#4eacff" opacity=".6" stroke-width="11"/>';
 else if(['swim','flow','org'].includes(k))o=[rect(8,14,50,23,'#315977'),rect(70,14,50,23,'#367b92'),rect(132,14,45,23,'#2f8a76'),'<path d="M58,26 H70 M120,26 H132" stroke="#a9c9e6" stroke-width="2"/>',rect(70,55,50,23,'#315977'),'<path d="M95,37 V55" stroke="#a9c9e6" stroke-width="2"/>'].join('');
 else if(k==='time')o='<path d="M10,49 H176" stroke="#536f8b" stroke-width="2"/>'+[18,54,91,129,169].map((x,i)=>`<circle cx="${x}" cy="49" r="7" fill="${i%2?'#4bd09c':'#4eacff'}"/>`).join('');
