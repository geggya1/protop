name: Verify pull request

# Bygger web og kjører verify:web på pull requests, uten å publisere noe.
# Deploy skjer fortsatt bare fra main (deploy-hosting.yml).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Verify web
        timeout-minutes: 8
        run: npm run verify:web
      - run: npm run build:web
        env:
          APP_BUILD_ID: ${{ github.sha }}
      - run: npm run verify:dist
