name: Deploy Firestore rules

# Kjøres manuelt. Regeltestene mot emulatoren må være grønne før reglene går live.
# Bruker firebase.rules.json (firebase.json skal bare inneholde hosting).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules-protop-c189c
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@4
      - name: Firestore rules (emulator)
        run: npx firebase emulators:exec --only firestore --config firebase.rules.json --project demo-protop "node --test --test-concurrency=1 tests/rules/firestore.rules.test.mjs tests/rules/appCollections.rules.test.mjs tests/rules/employeeInvite.rules.test.mjs"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com
      - name: Deploy rules to protop-c189c
        run: |
          set -o pipefail
          if ! npx firebase deploy --only firestore:rules --config firebase.rules.json --project protop-c189c --non-interactive 2>&1 | tee deploy.log; then
            echo "::error title=Firestore rules deploy::$(grep -iE 'error|denied|permission' deploy.log | tail -5 | tr '\n' ' ')"
            exit 1
          fi
      # Indekser: emulatoren krever dem ikke, Firestore i skyen gjør det (collectionGroup-
      # spørringer og sammensatte spørringer). Uten --force slettes ingenting som allerede
      # finnes i prosjektet; nye indekser opprettes. Mangler tjenestekontoen tilgang
      # (datastore.indexes.create), stopper ikke regeldeployen, men varselet sier hva som mangler.
      - name: Deploy indexes to protop-c189c
        run: |
          set -o pipefail
          if ! npx firebase deploy --only firestore:indexes --config firebase.rules.json --project protop-c189c --non-interactive 2>&1 | tee indexes.log; then
            echo "::warning title=Firestore indexes deploy::$(grep -iE 'error|denied|permission' indexes.log | tail -5 | tr '\n' ' ')"
          fi
