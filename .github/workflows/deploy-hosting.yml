name: Deploy hosting

on:
  push:
    branches:
      - offentlig
  workflow_dispatch:
    inputs:
      confirm:
        description: Skriv offentlig for å sende alt som ikke er live ut på protop.no
        required: true
        type: string

concurrency:
  group: hosting-protop-c189c
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'offentlig'
    runs-on: ubuntu-latest
    steps:
      - name: Offentlig utsending
        run: echo "Sender ${GITHUB_SHA} live til protop.no (ref ${GITHUB_REF})"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify:local-web

      - run: npm run build:web
        env:
          APP_BUILD_ID: ${{ github.sha }}

      - run: npm run verify:dist

      - name: Refuse any deploy target other than ProTop hosting
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const keys = Object.keys(cfg);
          const extra = keys.filter((k) => k !== 'hosting' && k !== 'emulators');
          if (extra.length) {
            console.error('firebase.json may only contain hosting and emulators, found:', extra.join(','));
            process.exit(1);
          }
          if (!cfg.hosting) {
            console.error('firebase.json must contain hosting');
            process.exit(1);
          }
          if (cfg.hosting.site !== 'protop-c189c') {
            console.error('hosting site must be protop-c189c');
            process.exit(1);
          }
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com

      - name: Deploy slim Cloud Functions
        continue-on-error: true
        # Krever Cloud Functions Admin og Service Account User på deploy-kontoen.
        # WEEKPLAN_GEMINI_KEY må ligge i GitHub secrets for AI-scan; tom nøkkel
        # deployer fortsatt funksjonen (ellers 404/CORS). Hvert kall er uavhengig.
        env:
          WEEKPLAN_GEMINI_KEY: ${{ secrets.WEEKPLAN_GEMINI_KEY }}
        run: bash scripts/deploy-slim-functions.sh

      - run: npx firebase deploy --only hosting --project protop-c189c --non-interactive
