name: Deploy hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Hosting og funksjoner har hvert sitt concurrency-gruppe. En lang
# funksjonsdeploy skal ikke holde protop.no på en eldre SHA, og en ny
# push skal avbryte web-bygget som ennå ikke er live. Funksjonsdeployen
# fullfører den som allerede kjører; eldre ventende funksjonsjobber
# avbrytes av GitHub når en nyere kommer i samme gruppe.
# functions-gate hopper over selve deploy-jobben når functions/ og filene
# den importerer er uendret. En hoppet jobb tar ikke concurrency-låsen,
# så web-pusher blir grønne uten å vente på forrige funksjonsdeploy.
# Gaten kjører parallelt med hosting. En ny funksjonsdeploy avbryter en
# eldre som fortsatt kjører, så en halvferdig serie-deploy ikke blir stående.
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hosting-protop-c189c
      cancel-in-progress: true
    steps:
      - name: Deploy to protop.no
        run: echo "Sender ${GITHUB_SHA} live til protop.no (ref ${GITHUB_REF})"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # intakeScan.test.mjs (verify:web) trenger functions-deps (firebase-functions, msgreader).
      - run: npm ci --prefix functions

      - name: Verify web
        timeout-minutes: 8
        run: npm run verify:web

      - run: npm run build:web
        env:
          APP_BUILD_ID: ${{ github.sha }}

      - run: npm run verify:dist

      - name: Refuse any deploy target other than ProTop hosting
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const keys = Object.keys(cfg);
          const extra = keys.filter((k) => k !== 'hosting');
          if (extra.length) {
            console.error('firebase.json may only contain hosting, found:', extra.join(','));
            process.exit(1);
          }
          if (!cfg.hosting) {
            console.error('firebase.json must contain hosting');
            process.exit(1);
          }
          if (cfg.hosting.site !== 'protop-c189c') {
            console.error('hosting site must be protop-c189c');
            process.exit(1);
          }
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com

      - run: npx firebase deploy --only hosting --project protop-c189c --non-interactive

  functions-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.functions_src.outputs.deploy }}
      entries: ${{ steps.functions_src.outputs.entries }}
    steps:
      - uses: actions/checkout@v4

      - name: See if Cloud Functions must deploy
        id: functions_src
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "entries=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/functions-deploy-needed.mjs --check "${{ github.event.before }}" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  functions:
    needs: functions-gate
    if: needs.functions-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: functions-protop-c189c
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm ci --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com

      - name: Ensure Firebase Storage bucket
        # Oppretter default-bucket hvis den mangler, setter CORS, og skriver en probe.
        # github-hosting-deploy mangler ofte storage.buckets.create — da skal Hosting
        # og slim functions likevel deployes. CV-opplasting feiler til bucketen finnes
        # (opprett via Firebase Console → Storage → Get started, eller eier-innlogging).
        continue-on-error: true
        run: |
          npm ci --prefix functions
          NODE_PATH="$PWD/functions/node_modules" node scripts/apply-storage-cors.mjs

      - name: Deploy slim Cloud Functions
        continue-on-error: true
        # Krever Cloud Functions Admin og Service Account User på deploy-kontoen.
        # PROTOP_GEMINI_KEY er riktig secret-navn (ProTop Gemini-nøkkel).
        # Fallback til gammelt navn bare hvis det nye ikke er opprettet ennå.
        # Tom nøkkel deployer fortsatt funksjonen (ellers 404/CORS).
        env:
          PROTOP_GEMINI_KEY: ${{ secrets.PROTOP_GEMINI_KEY || secrets.WEEKPLAN_GEMINI_KEY }}
          FUNCTION_ENTRIES: ${{ needs.functions-gate.outputs.entries }}
        run: bash scripts/deploy-slim-functions.sh
