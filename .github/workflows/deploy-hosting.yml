name: Deploy hosting

on:
  push:
    branches:
      - main

concurrency:
  group: hosting-protop-c189c
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - run: npm run verify:dist

      - name: Refuse any deploy target other than ProTop hosting
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const keys = Object.keys(cfg);
          if (keys.length !== 1 || keys[0] !== 'hosting') {
            console.error('firebase.json may only contain hosting');
            process.exit(1);
          }
          if (cfg.hosting.site !== 'protop-c189c') {
            console.error('hosting site must be protop-c189c');
            process.exit(1);
          }
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com

      - name: Deploy slim Cloud Functions
        continue-on-error: true
        # Krever Cloud Functions Admin og Service Account User på deploy-kontoen.
        # Slim entries avoid MAIL_API_KEY Secret Manager. generateCompanyForm 404
        # shows as CORS + «internal» in Mine skjemaer until this ships.
        run: |
          node --input-type=module -e "
          import { readFileSync, writeFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('firebase.json', 'utf8'));
          writeFileSync('firebase.functions.json', JSON.stringify({ ...cfg, functions: { source: 'functions' } }));
          "
          npm ci --prefix functions
          deploy_entry() {
            local entry="$1"
            local only="$2"
            node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const path = 'functions/package.json';
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            pkg.main = process.argv[1];
            writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            " "$entry"
            npx firebase deploy --only "$only" --config firebase.functions.json --project protop-c189c --non-interactive
          }
          deploy_entry tenderIndex.js functions:tenderProxy
          deploy_entry anbudFormIndex.js functions:generateCompanyForm
          deploy_entry openFeedIndex.js functions:fetchOpenFeed
          deploy_entry interpretAvtaleIndex.js functions:interpretAvtaleHttp
          deploy_entry friendListIndex.js functions:friendListHttp
          deploy_entry friendInviteIndex.js functions:listMyFriends,functions:listFriendRequests
          node --input-type=module -e "
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'functions/package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.main = 'index.js';
          writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f firebase.functions.json

      - run: npx firebase deploy --only hosting --project protop-c189c --non-interactive
