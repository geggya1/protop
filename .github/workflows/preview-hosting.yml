name: Preview hosting

# Samme nettsted (protop-c189c), men kanal «utvikling» — ikke live protop.no.
# Live deploy skjer bare fra deploy-hosting.yml på main.
on:
  push:
    branches-ignore:
      - main
      - offentlig

concurrency:
  group: preview-hosting-utvikling
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      APP_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - run: npm run verify:dist

      - name: Refuse any deploy target other than ProTop hosting
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const keys = Object.keys(cfg);
          const extra = keys.filter((k) => k !== 'hosting' && k !== 'emulators');
          if (extra.length) {
            console.error('firebase.json may only contain hosting and emulators, found:', extra.join(','));
            process.exit(1);
          }
          if (!cfg.hosting) {
            console.error('firebase.json must contain hosting');
            process.exit(1);
          }
          if (cfg.hosting.site !== 'protop-c189c') {
            console.error('hosting site must be protop-c189c');
            process.exit(1);
          }
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330510386923/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-hosting-deploy@protop-c189c.iam.gserviceaccount.com

      - name: Deploy slim Cloud Functions
        continue-on-error: true
        run: bash scripts/ci-deploy-slim-functions.sh

      - name: Deploy preview channel (not live)
        run: |
          npx firebase hosting:channel:deploy utvikling \
            --expires 30d \
            --project protop-c189c \
            --non-interactive \
            --json > channel.json 2> channel.err
          cat channel.json
          cat channel.err

      - name: Comment stable preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-comment-preview.mjs
